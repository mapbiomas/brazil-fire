# Publishes static apps from utils/ to GitHub Pages:
#   https://mapbiomas.github.io/brazil-fire/<app>/
# To add another page, copy its files into _site/<app>/ in the "Assemble site" step.
name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "utils/fire_monitor_highlights/src/**"
      - "utils/fire_legends/app/**"
      - "utils/fire_dashboard/app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          app=_site/fire_monitor_highlights
          mkdir -p $app/brazil $app/peru
          cp -r utils/fire_monitor_highlights/src/brazil/. $app/brazil/
          cp $app/brazil/boletim-fogo.html $app/brazil/index.html
          cp -r utils/fire_monitor_highlights/src/peru/. $app/peru/
          cp $app/peru/boletin-fuego.html $app/peru/index.html
          mkdir -p _site/legends
          cp -r utils/fire_legends/app/. _site/legends/
          mkdir -p _site/dashboard
          cp -r utils/fire_dashboard/app/. _site/dashboard/
          cat > $app/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>MapBiomas Fire · Monthly bulletin</title>
          <h1>MapBiomas Fire · Boletim / Boletín</h1>
          <ul>
            <li><a href="brazil/">Brasil · Boletim do Monitor do Fogo</a></li>
            <li><a href="peru/">Perú · Boletín del Monitor de Fuego</a></li>
          </ul>
          EOF
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>MapBiomas Fire</title>
          <h1>MapBiomas Fire</h1>
          <ul>
            <li><a href="fire_monitor_highlights/">Boletim mensal / Boletín mensual</a></li>
            <li><a href="legends/">Legendas e paletas / Legends and palettes</a></li>
            <li><a href="dashboard/">MapBiomas Fogo Col. 5.1 · Brasil (painel) / MapBiomas Fire Col. 5.1 · Brazil (dashboard)</a></li>
          </ul>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4