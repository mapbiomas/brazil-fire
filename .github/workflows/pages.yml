# Publishes static apps from utils/ to GitHub Pages:
#   https://mapbiomas.github.io/brazil-fire/<app>/
# To add another page, copy its files into _site/<app>/ in the "Assemble site" step
# and add a card to utils/fire_showcase/app/index.html (the root page).
name: Publish GitHub Pages

on:
  # Every push to main: the repository map (utils/fire_repo_map) must match the current tree.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          app=_site/fire_monitor_highlights
          mkdir -p $app/brazil $app/peru
          cp -r utils/fire_monitor_highlights/src/brazil/. $app/brazil/
          cp $app/brazil/boletim-fogo.html $app/brazil/index.html
          cp -r utils/fire_monitor_highlights/src/peru/. $app/peru/
          cp $app/peru/boletin-fuego.html $app/peru/index.html
          mkdir -p _site/legends
          cp -r utils/fire_legends/app/. _site/legends/
          mkdir -p _site/dashboard
          cp -r utils/fire_dashboard/app/. _site/dashboard/
          python3 utils/fire_repo_map/build_repo_map.py
          mkdir -p _site/repo_map
          cp -r utils/fire_repo_map/app/. _site/repo_map/
          mkdir -p _site/global_analises
          cp global_analises/index.html _site/global_analises/
          cp -r global_analises/data _site/global_analises/
          cat > $app/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>MapBiomas Fire · Monthly bulletin</title>
          <h1>MapBiomas Fire · Boletim / Boletín</h1>
          <ul>
            <li><a href="brazil/">Brasil · Boletim do Monitor do Fogo</a></li>
            <li><a href="peru/">Perú · Boletín del Monitor de Fuego</a></li>
          </ul>
          EOF
          # Root page: showcase of the apps above, with the repository map tab.
          cp -r utils/fire_showcase/app/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4