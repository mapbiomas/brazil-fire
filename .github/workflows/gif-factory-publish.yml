# Publishes the MapBiomas GIF Factory (utils/mapbiomas_gif_factory) to PyPI.
#
#   Tag gif-factory-v0.2.0  ->  tests, build, publish mapbiomas-gif-factory 0.2.0 to PyPI
#   Manual run              ->  tests, build, publish to TestPyPI (rehearsal)
#
# Uses PyPI "trusted publishing" (no token stored in the repo). One-time setup on
# pypi.org / test.pypi.org: Publishing -> Add a pending publisher with
#   owner: mapbiomas · repository: brazil-fire · workflow: gif-factory-publish.yml
#   environment: pypi (or testpypi)
name: Publish GIF Factory to PyPI

on:
  push:
    tags: ["gif-factory-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: utils/mapbiomas_gif_factory

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "gif-factory-v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"; exit 1; }
      - name: Run tests
        run: |
          python -m pip install -q build twine pytest earthengine-api Pillow requests ipywidgets ipython pyyaml ipyleaflet
          PYTHONPATH=src python -m pytest -q tests
      - name: Build
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: utils/mapbiomas_gif_factory/dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/gif-factory-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mapbiomas-gif-factory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mapbiomas-gif-factory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
