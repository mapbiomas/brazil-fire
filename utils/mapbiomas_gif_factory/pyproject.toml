[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapbiomas-gif-factory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["earthengine-api>=1.4", "Pillow>=9.5", "requests>=2.28", "ipywidgets>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]
