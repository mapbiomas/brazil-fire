<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Legendas MapBiomas Fogo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho com logo e abas (Consultar | Cadastro). Consultar = filtros à esquerda + legenda/metadados/exportação.
   Cadastro = matriz país×coleção×subproduto com status das paletas + editor de paleta abaixo. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1e2420; --muted:#5f6a63; --line:#dbe1da;
  --accent:#e5412e; --accent-soft:#fbe3df; --green:#3f7d52; --green-soft:#e0eee3; --warn:#86600a; --warn-soft:#f5ebd0;
  --red:#b3261e; --red-soft:#f8e1df; --code:#f6f8f5;
  --f-sans:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1d211e; --ink:#e7ece8; --muted:#9ba69f; --line:#343b36;
  --accent:#f26b61; --accent-soft:#3a1c19; --green:#8bc79c; --green-soft:#1e3125; --warn:#e6c069; --warn-soft:#382e16;
  --red:#f09a92; --red-soft:#3b1d1b; --code:#181b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1d211e; --ink:#e7ece8; --muted:#9ba69f; --line:#343b36;
  --accent:#f26b61; --accent-soft:#3a1c19; --green:#8bc79c; --green-soft:#1e3125; --warn:#e6c069; --warn-soft:#382e16;
  --red:#f09a92; --red-soft:#3b1d1b; --code:#181b19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:52px;width:auto;background:#fff;border-radius:8px;padding:4px 6px;flex:none}
.brand h1{font-weight:700;font-size:clamp(1.25rem,2.6vw,1.7rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink);font:600 12.5px var(--f-sans);padding:8px 13px;cursor:pointer}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.lab{font:600 10.5px var(--f-sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
select,input[type=number],input[type=text],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12.5px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.row3{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px var(--f-sans);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.bucket{background:var(--accent)} .dot.site{background:var(--green)} .dot.dev{background:var(--warn)}
.badge{font:600 10.5px var(--f-sans);padding:3px 8px;border-radius:5px;display:inline-block;white-space:nowrap;letter-spacing:.02em}
.badge.bucket{background:var(--accent-soft);color:var(--accent)} .badge.site{background:var(--green-soft);color:var(--green)} .badge.dev{background:var(--warn-soft);color:var(--warn)}
.badge.validada{background:var(--green-soft);color:var(--green)} .badge.revisao{background:var(--accent-soft);color:var(--accent)} .badge.rascunho{background:var(--warn-soft);color:var(--warn)} .badge.faltando{background:var(--red-soft);color:var(--red)}
.src{font:600 10px var(--f-sans);padding:2px 6px;border-radius:4px;white-space:nowrap}
.src.oficial{background:var(--green-soft);color:var(--green)} .src.interp{background:var(--accent-soft);color:var(--accent)} .src.proposta{background:var(--warn-soft);color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.filters label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0}
.note.warn{border-color:var(--warn);color:var(--ink)}
.work{display:flex;flex-direction:column;gap:18px;min-width:0}
.top2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:1120px){.top2{grid-template-columns:1fr}}
.legend{background:#fff;color:#1b1b1b;border:1px solid var(--line);border-radius:6px;padding:18px 20px;min-width:0;font-family:var(--f-sans)}
.legend h2{font-size:1.05rem;font-weight:700;margin:0;line-height:1.25}
.legend .meta{font-size:11.5px;color:#5d5d5d;margin:3px 0 14px}
.lg-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px 16px}
.lg-item{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.lg-item i{flex:none;width:22px;height:14px;border:1px solid rgba(0,0,0,.18);border-radius:2px}
.lg-item i.missing{background:repeating-linear-gradient(45deg,#ddd 0 3px,#fff 3px 6px)!important}
.lg-item span{overflow-wrap:anywhere}
.lg-bar{height:18px;border-radius:2px;border:1px solid rgba(0,0,0,.18)}
.lg-ticks{display:flex;justify-content:space-between;font:11.5px var(--f-mono);color:#444;margin-top:4px;font-variant-numeric:tabular-nums}
.lg-foot{font-size:10.5px;color:#7a7a7a;margin-top:14px}
.lg-table-wrap{border:1px solid #dfe9e2;border-radius:8px;overflow-x:auto}
.lg-table{width:100%;border-collapse:collapse;font-size:14px;color:#2b2b2b}
.lg-table th{background:#eef6f1;color:#3f7d52;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:12px 16px;border-bottom:1px solid #dfe9e2;white-space:nowrap}
.lg-table td{padding:11px 16px;border-bottom:1px solid #ececec;vertical-align:middle}
.lg-table tr:last-child td{border-bottom:0}
.lg-table td:first-child{font-weight:600}
.lg-table td.code{font-variant-numeric:tabular-nums}
.lg-table td.hex{white-space:nowrap}
.lg-table td.hex i{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,.12);vertical-align:-2px;margin-right:6px}
.lg-table td.hex i.missing{background:repeating-linear-gradient(45deg,#ddd 0 3px,#fff 3px 6px)!important}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-weight:600;font-size:1rem;margin:0}
.strip{display:flex;height:38px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.strip button{flex:1;border:0;cursor:pointer;min-width:0;padding:0}
.strip button:hover{outline:2px solid var(--ink);outline-offset:-2px}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
.twrap.tall{max-height:460px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 10.5px var(--f-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);width:56px}
td input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
td input[type=text],td input[type=number]{padding:5px 7px;font-size:13px}
td input.hex{font-family:var(--f-mono);width:92px}
td input.code{font-family:var(--f-mono);width:64px}
td .sw{display:inline-block;width:26px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:middle}
.btn{font:600 12.5px var(--f-sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 6px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);font:600 12px var(--f-mono);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:360px;font:12px/1.5 var(--f-mono);white-space:pre}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font:600 10.5px var(--f-sans);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.sources{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.sources a{color:var(--accent)}
/* Matriz de cadastro */
.matrix td,.matrix th{border-right:1px solid var(--line)}
.matrix th.rowh,.matrix td.rowh{position:sticky;left:0;background:var(--surface);z-index:2;min-width:190px}
.matrix th.rowh{z-index:3}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid transparent;background:none;color:inherit;font:inherit;cursor:pointer;padding:4px 6px;border-radius:6px;width:100%;min-width:74px}
.cell:hover{border-color:var(--line);background:var(--bg)}
.cell[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cell .n{font:600 11px var(--f-mono);color:var(--muted)}
.cell .mini{display:flex;height:6px;width:60px;border-radius:2px;overflow:hidden;background:var(--line)}
.cell .mini i{flex:1}
.na{color:var(--line);text-align:center}
.legendbar{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);align-items:center}
.editor-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.editor-h h3{margin:0;font-size:1.05rem}
.editor-h .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tool{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.tool h4{margin:0;font-size:12.5px;font-weight:600}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--red-soft);border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo" id="logo" src="logos/MapBiomas_Fogo_PT.png" alt="MapBiomas Fogo">
      <div>
        <h1><span id="t-title"></span></h1>
        <p id="t-sub"></p>
      </div>
    </div>
    <div class="hright">
      <div class="seg" role="tablist" aria-label="Modo">
        <button id="view-consult" data-view="consultar" role="tab"></button><button id="view-reg" data-view="cadastro" role="tab"></button>
      </div>
      <div class="seg" role="group" aria-label="Idioma">
        <button id="lang-pt" data-lang="pt">PT</button><button id="lang-es" data-lang="es">ES</button><button id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- ===================== CONSULTAR ===================== -->
  <div class="grid" id="v-consultar">
    <aside class="panel" aria-label="Filtros">
      <div class="field">
        <label class="lab" for="sel-country" id="t-country"></label>
        <select id="sel-country"></select>
      </div>
      <div class="field">
        <span class="lab" id="t-colls"></span>
        <div class="filters" id="status-filters"></div>
        <div class="chips" id="coll-chips"></div>
        <div id="coll-info"></div>
      </div>
      <div class="field">
        <label class="lab" for="sel-sub" id="t-subprod"></label>
        <select id="sel-sub"></select>
      </div>
      <div class="field" id="period-box"></div>
      <div id="pal-state"></div>
    </aside>

    <main class="work">
      <div class="top2">
        <section class="panel">
          <div class="card-h">
            <h3 id="t-legend"></h3>
            <div class="seg" role="group" id="layout-seg">
              <button data-layout="list" id="lay-list"></button><button data-layout="table" id="lay-table"></button><button data-layout="bar" id="lay-bar"></button>
            </div>
          </div>
          <div class="legend" id="legend"></div>
          <div class="btns">
            <button class="btn" id="dl-svg" type="button">SVG</button>
            <button class="btn" id="dl-png" type="button">PNG</button>
          </div>
        </section>
        <section class="panel">
          <div class="card-h"><h3 id="t-meta"></h3></div>
          <dl class="kv" id="meta"></dl>
          <div id="meta-note" style="display:flex;flex-direction:column;gap:8px"></div>
        </section>
      </div>

      <section class="panel">
        <div class="card-h">
          <h3 id="t-palette"></h3>
          <button class="btn" id="btn-copyhex" type="button"></button>
        </div>
        <div class="strip" id="strip"></div>
        <div class="twrap tall"><table><thead><tr><th id="th-v"></th><th id="th-c"></th><th>HEX</th><th id="th-l"></th></tr></thead><tbody id="ptable"></tbody></table></div>
      </section>

      <section class="panel">
        <div class="card-h">
          <h3 id="t-export"></h3>
          <div class="btns">
            <button class="btn" id="btn-copy" type="button"></button>
            <button class="btn pri" id="btn-dl" type="button"></button>
          </div>
        </div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <pre id="code" tabindex="0"></pre>
      </section>
    </main>
  </div>

  <!-- ===================== CADASTRO ===================== -->
  <div id="v-cadastro" class="work" hidden>
    <div id="db-banner"></div>
    <section class="panel">
      <div class="card-h">
        <h3 id="t-matrix"></h3>
        <div class="btns">
          <div class="filters" id="m-filters"></div>
        </div>
      </div>
      <p class="note" id="t-matrix-note"></p>
      <div class="legendbar" id="m-legend"></div>
      <div class="twrap"><table class="matrix" id="matrix"></table></div>
    </section>

    <section class="panel" id="newcoll" hidden></section>
    <section class="panel" id="editor" hidden></section>

  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ===================== Cor ===================== */
const hex2rgb=h=>{h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgb2hex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const s2l=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const l2s=c=>255*(c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055);
function toOk(h){const[r,g,b]=hex2rgb(h).map(s2l);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
function fromOk([L,A,B]){const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.291485548*B)**3;
  return rgb2hex([4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(l2s))}
const mix=(a,b,f)=>{const A=toOk(a),B=toOk(b);return fromOk(A.map((v,j)=>v+(B[j]-v)*f))};
// reamostra uma lista de cores para n classes (interpolação OKLab)
function resample(stops,n){
  if(!stops.length)return[];if(stops.length===n)return stops.slice();if(n===1)return[stops[stops.length-1]];if(stops.length===1)return Array(n).fill(stops[0]);
  const out=[];for(let i=0;i<n;i++){const p=i/(n-1)*(stops.length-1),k=Math.min(Math.floor(p),stops.length-2);out.push(mix(stops[k],stops[k+1],p-k))}return out}
const okHex=h=>/^#[0-9a-f]{6}$/i.test(h||"");

/* ===================== Classes esperadas por coleção ===================== */
// O número de classes depende do período de cada país/coleção (ex.: frequência = nº de anos da série)
function expectedValues(c,sub){
  const N=c.end-c.start+1,k=SUBS[sub].kind,seq=(a,n)=>Array.from({length:Math.max(n,0)},(_,i)=>a+i);
  switch(k){
    case"single":return[1];
    case"monthly":return seq(1,12);
    case"severity":return seq(1,6);
    case"scar":return seq(1,c.scarN||8);
    case"frequency":return seq(1,N);
    case"yearlast":return seq(c.start,N);
    case"years":return seq(1,N);
    case"interval":return seq(1,N-1);
    case"lulc":return null;
  }
}
function rangeText(vals){return vals.length>1?`${vals[0]}–${vals[vals.length-1]}`:String(vals[0])}
function autoLabel(sub,v,L){
  const k=SUBS[sub].kind,tt=key=>T[L][key];
  switch(k){
    case"single":return SUBS[sub].cls[L];
    case"monthly":return MONTHS[L][v-1]||String(v);
    case"severity":return(SEVERITY_LABELS[v-1]||[String(v),String(v),String(v)])[LANGS.indexOf(L)];
    case"frequency":return `${v} ${v>1?tt("timesN"):tt("times1")}`;
    case"years":case"interval":return `${v} ${v>1?tt("yrN"):tt("yr1")}`;
    case"yearlast":return String(v);
    case"scar":return `${tt("cls")} ${v}`;
    default:return String(v);
  }
}
function scarLabel(v,L){const r=SCAR8[v-1];if(!r)return null;const f=x=>x.toLocaleString({pt:"pt-BR",es:"es-ES",en:"en-US"}[L]);
  return r[1]==null?`≥ ${f(r[0])} ha`:r[0]===0?`< ${f(r[1])} ha`:`${f(r[0])} – ${f(r[1])} ha`}
const isCategorical = sub=>["lulc","scar","severity","single"].includes(SUBS[sub].kind);

/* ----- sugestão inicial: cores do site (Brasil) quando existem, senão escala padrão ----- */
function suggestClasses(c,sub,mode){
  const k=SUBS[sub].kind;
  if(k==="lulc")return LULC.map(r=>({v:r[0],hex:r[1],src:"proposta",pt:r[2],es:r[3],en:r[4]}));
  const vals=expectedValues(c,sub);
  const site=SITE[sub],useSite=(mode==="site"||!mode)&&site;
  let hexes,srcs;
  if(useSite){
    // âncoras do site + interpolação entre elas pela escala padrão do tipo
    const base=resample(RAMPS[DEFAULT_RAMP[k]].stops,vals.length);
    const anchors=Object.entries(site).map(([v,h])=>[+v,h]).sort((a,b)=>a[0]-b[0]);
    hexes=vals.map((v,i)=>{const ex=site[v];if(ex)return ex;
      if(k==="severity")return base[i];
      const lo=[...anchors].reverse().find(a=>a[0]<v),hi=anchors.find(a=>a[0]>v);
      if(lo&&hi)return mix(lo[1],hi[1],(v-lo[0])/(hi[0]-lo[0]));
      if(lo&&!hi&&k!=="severity"){const j=vals.indexOf(lo[0]);return j>=0?mix(lo[1],base[base.length-1],(i-j)/Math.max(vals.length-1-j,1)):base[i]}
      return base[i]});
    srcs=vals.map(v=>site[v]?(c.country==="brasil"?"oficial":"proposta"):(k==="severity"?"proposta":"interp"));
  }else{
    const rk=mode&&RAMPS[mode]?mode:DEFAULT_RAMP[k];
    hexes=resample(RAMPS[rk].stops,vals.length);srcs=vals.map(()=>"proposta");
  }
  return vals.map((v,i)=>{
    const o={v,hex:hexes[i],src:srcs[i]};
    if(k==="severity")LANGS.forEach((L,j)=>o[L]=SEVERITY_LABELS[v-1]?.[j]||"");
    if(k==="scar"&&c.scarN===8)LANGS.forEach(L=>o[L]=scarLabel(v,L)||"");
    if(k==="single")LANGS.forEach(L=>o[L]=SUBS[sub].cls[L]);
    return o});
}
function paletteOf(c,sub){
  const doc=PAL[pkey(c,sub)];
  if(doc&&Array.isArray(doc.classes)&&doc.classes.length)return{registered:true,status:doc.status||"rascunho",classes:doc.classes,doc};
  return{registered:false,status:"faltando",classes:suggestClasses(c,sub)};
}
function labelOf(sub,o,L){return(o[L]&&String(o[L]).trim())||autoLabel(sub,o.v,L)}

/* ===================== Consulta: itens do período ===================== */
function yearOptions(c,sub){const a=[],lo=sub.period==="ref"?c.start+1:c.start,hi=sub.period==="ref"?c.end+1:c.end;for(let y=lo;y<=hi;y++)a.push(y);return a}
function periodValues(c,sub){
  const k=SUBS[sub].kind,seq=(a,n)=>Array.from({length:Math.max(n,1)},(_,i)=>a+i);
  if(k==="frequency"){const pal=paletteOf(c,sub),mx=pal.registered?Math.max(...pal.classes.map(o=>o.v)):Infinity;return seq(1,Math.min(S.e-S.s+1,mx))}
  if(k==="yearlast")return seq(c.start,S.y-c.start);
  if(k==="years")return seq(1,S.y-c.start);
  return null; // demais: todas as classes cadastradas
}
function items(){
  const c=collObj(),pal=paletteOf(c,S.sub),vals=periodValues(c,S.sub);
  const byV=new Map(pal.classes.map(o=>[o.v,o]));
  const list=vals?vals.map(v=>byV.get(v)||{v,hex:"#d9d9d9",src:"proposta",missing:true}):pal.classes;
  return{pal,items:list.map(o=>({...o,label:labelOf(S.sub,o,S.lang)}))};
}
function visParams(it){
  if(SUBS[S.sub].kind==="lulc"){const mx=Math.max(69,...it.map(o=>o.v));const pal=Array(mx+1).fill("#ffffff");it.forEach(o=>{pal[o.v]=o.hex});return{min:0,max:mx,palette:pal}}
  return{min:it[0].v,max:it[it.length-1].v,palette:it.map(o=>o.hex)}
}
function bandName(sub){return SUBS[sub].band.replace("{y}",S.y).replace("{s}",S.s).replace("{e}",S.e)}
function isPre(c){return S.s===c.start||S.e===c.end}
function periodLabel(){return SUBS[S.sub].period==="range"?`${S.s}–${S.e}`:String(S.y)}
// caminho do GeoTIFF no bucket, conforme padrão de nomes observado em cada pasta
function gcsInfo(c,sub){
  if(!c.root)return null;
  const yp=SUBS[sub].period==="range"?`${S.s}_${S.e}`:String(S.y),f=regFolder(sub);
  let band=bandName(sub);
  if(sub==="year_last_fire")band=`${c.ylfBand||"year_last_fire"}_${S.y}`;
  switch(c.layout){
    case"reg":return{file:`${GCS}${c.root}${f}/${f}-${c.country}_${band}.tif`};
    case"chile":return{file:`${GCS}${c.root}${f}_v1/mapbiomas_fire_chile_col1_${f}_${yp}.tif`};
    case"br5":return{file:`${GCS}${c.root}mapbiomas_fire_collection5_${sub}_v1/${band}.tif`};
    case"monitor":return{folder:`${GCS}${c.root}`,pattern:`monthly_burned-${c.country}_${S.y}_MM.tif`};
    default:return{folder:`${GCS}${c.root}`};
  }
}

function codeFor(tab,it){
  const c=collObj(),sub=SUBS[S.sub],asset=c.asset?c.asset(S.sub):null,vp=visParams(it),band=bandName(S.sub),g=gcsInfo(c,S.sub);
  const name=`${S.sub}_${periodLabel().replace("–","_")}`;
  const palArr="['"+vp.palette.join("', '")+"']";
  const decode=sub.decode==="div100"?".divide(100).int()":sub.decode==="mod100"?".mod(100)":"";
  const head=`MapBiomas Fogo · ${countryName(c.country)} · Col. ${c.id} · ${legendTitle()} · ${periodLabel()}`;
  switch(tab){
    case"hex":return it.map(o=>`${o.v}\t${o.hex}`).join("\n");
    case"hexc":return it.map(o=>`"${o.hex}"`).join(", ");
    case"csv":return "value,label,hex\n"+it.map(o=>`${o.v},"${o.label.replace(/"/g,'""')}",${o.hex}`).join("\n");
    case"json":return JSON.stringify({product:"MapBiomas Fogo",country:c.country,collection:c.id,subproduct:S.sub,period:periodLabel(),
      asset,gcs:g?(g.file||g.folder):null,vis:{min:vp.min,max:vp.max},citation:cite(),classes:it.map(o=>({value:o.v,label:o.label,hex:o.hex}))},null,2);
    case"gee":case"py":{
      const py=tab==="py";let src;
      if(asset&&S.sub==="fire_frequency"&&!isPre(c))src=py
        ?`annual = ee.Image('${c.asset("annual_burned")}')\nyears = ee.List.sequence(${S.s}, ${S.e})\n# Soma servidor-side das máscaras anuais (sem getInfo)\nimg = (ee.ImageCollection.fromImages(years.map(\n        lambda y: annual.select(ee.String('burned_area_').cat(ee.Number(y).int().format())).gt(0).unmask(0).rename('f')))\n       .sum().selfMask().rename('${band}'))`
        :`var annual = ee.Image('${c.asset("annual_burned")}');\nvar years = ee.List.sequence(${S.s}, ${S.e});\n// Soma servidor-side das máscaras anuais (sem getInfo)\nvar img = ee.ImageCollection.fromImages(years.map(function (y) {\n  return annual.select(ee.String('burned_area_').cat(ee.Number(y).int().format())).gt(0).unmask(0).rename('f');\n})).sum().selfMask().rename('${band}');`;
      else if(asset)src=py?`img = ee.Image('${asset}').select('${band}')${decode}`:`var img = ee.Image('${asset}').select('${band}')${decode};`;
      else if(g&&g.file)src=py?`# GeoTIFF (COG) do bucket oficial\nimg = ee.Image.loadGeoTIFF('${g.file}')${decode}.selfMask()`:`// GeoTIFF (COG) do bucket oficial\nvar img = ee.Image.loadGeoTIFF('${g.file}')${decode}.selfMask();`;
      else if(g&&g.pattern)src=py?`# Mensal: um arquivo por mês (MM = 01..12)\nimg = ee.Image.loadGeoTIFF('${g.folder}${g.pattern.replace("MM","08")}').selfMask()`:`// Mensal: um arquivo por mês (MM = 01..12)\nvar img = ee.Image.loadGeoTIFF('${g.folder}${g.pattern.replace("MM","08")}').selfMask();`;
      else src=py?`# ${g?g.folder:"sem dado publicado"}\nimg = ee.Image('ASSET_ID')`:`// ${g?g.folder:"sem dado publicado"}\nvar img = ee.Image('ASSET_ID');`;
      return py?`import ee\nee.Initialize()\n\n# ${head}\n${src}\n\nvis = {\n    'min': ${vp.min},\n    'max': ${vp.max},\n    'palette': ${palArr},\n}\n# geemap: Map.addLayer(img, vis, '${name}')`
        :`// ${head}\n${src}\n\nvar vis = {\n  min: ${vp.min},\n  max: ${vp.max},\n  palette: ${palArr}\n};\nMap.addLayer(img, vis, '${name}');`;}
  }
}
const TABS=[["hex","HEX","txt"],["hexc","HEX (,)","txt"],["gee","GEE JS","txt"],["py","GEE Python","txt"],["csv","CSV","csv"],["json","JSON","json"]];
function renderExport(it){
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===S.tab}">${l}</button>`).join("");
  $("code").textContent=codeFor(S.tab,it);
}
function legendSVG(it){
  const cols=it.length>16?2:1,rows=Math.ceil(it.length/cols),colW=230,W=cols*colW+32,H=78+rows*22+30;let g="";
  it.forEach((o,i)=>{const cx=16+Math.floor(i/rows)*colW,cy=78+(i%rows)*22;
    g+=`<rect x="${cx}" y="${cy}" width="22" height="14" fill="${o.hex}" stroke="#00000030"/><text x="${cx+30}" y="${cy+11.5}" font-size="13" fill="#1b1b1b">${esc(o.label)}</text>`});
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Montserrat, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="32" font-size="17" font-weight="700" fill="#1b1b1b">${esc(legendTitle())}</text>
<text x="16" y="54" font-size="12" fill="#5d5d5d">${esc(legendMeta())}</text>
${g}
<text x="16" y="${H-12}" font-size="10.5" fill="#7a7a7a">${esc(cite())}</text></svg>`;
}
function svgToPng(svg){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"})),img=new Image();
  img.onload=()=>{const k=2,cv=document.createElement("canvas");cv.width=img.width*k;cv.height=img.height*k;
    const cx=cv.getContext("2d");cx.scale(k,k);cx.drawImage(img,0,0);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(),"image/png")};
  img.onerror=rej;img.src=url})}
function renderConsult(){
  if(!renderControls()){["legend","strip","ptable","meta","meta-note"].forEach(i=>$(i).innerHTML="");$("code").textContent="";return}
  const {pal,items:it}=items();renderLegend(it);renderMeta(it,pal);renderPalette(it);renderExport(it);
}

/* ===================== Cadastro: matriz ===================== */
function renderMatrix(){
  originFilters("m-filters",S.mOrigin,"mf");
  const colls=allCollections().filter(c=>S.mOrigin[c.origin]);
  const head=`<thead><tr><th class="rowh">${t("country")} · ${t("colls")}</th>${SUB_ORDER.map(s=>`<th title="${esc(SUBS[s].name[S.lang])}">${esc(SUBS[s].short[S.lang])}</th>`).join("")}</tr></thead>`;
  const body=colls.map(c=>`<tr><td class="rowh"><strong>${esc(countryName(c.country))}</strong> · ${esc(c.id)}<br><span class="note" style="border:0;padding:0">${c.start}–${c.end}</span></td>`+
    SUB_ORDER.map(s=>{
      if(!c.subs.includes(s))return`<td class="na">—</td>`;
      const vals=expectedValues(c,s),doc=PAL[pkey(c,s)],st=doc?.classes?.length?(doc.status||"rascunho"):"faltando";
      const hexes=doc?.classes?.map(o=>o.hex)||[],mini=hexes.length?resample(hexes.filter(okHex),Math.min(8,hexes.length)):[];
      const cur=ED&&ED.key===pkey(c,s);
      return`<td><button class="cell" data-cell="${esc(pkey(c,s))}" aria-current="${cur}"><span class="n">${vals?vals.length:"LULC"}</span>
        <span class="mini">${mini.map(h=>`<i style="background:${h}"></i>`).join("")}</span><span class="badge ${st}">${t("st_"+st)}</span></button></td>`}).join("")+`</tr>`).join("");
  $("matrix").innerHTML=head+`<tbody>${body}</tbody>`;
  $("m-legend").innerHTML=["validada","revisao","rascunho","faltando"].map(s=>`<span class="badge ${s}">${t("st_"+s)}</span>`).join("");
  const banner=dbState==="none"?"":canWrite===false?t("ed_readOnly"):"";
  $("db-banner").innerHTML=banner?`<div class="banner">${esc(banner)}</div>`:"";
}
function writable(){return dbState==="ready"&&canWrite!==false}

/* ===================== Cadastro: editor ===================== */
function findByKey(key){for(const c of allCollections())for(const s of c.subs)if(pkey(c,s)===key)return{c,sub:s};return null}
function openEditor(key,scroll=true){
  const f=findByKey(key);if(!f)return;
  const doc=PAL[key],pal=paletteOf(f.c,f.sub);
  ED={key,c:f.c,sub:f.sub,classes:pal.classes.map(o=>({...o})),status:doc?.status||"rascunho",notes:doc?.notes||"",
    dirty:!doc,baseUpdatedAt:doc?.updatedAt||null,remoteChanged:false,confirmDel:false,
    tool:{ramp:DEFAULT_RAMP[SUBS[f.sub].kind],rev:false,copyFrom:"",paste:""}};
  renderEditor();renderMatrix();
  if(scroll)$("editor").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function edExpected(){return expectedValues(ED.c,ED.sub)}
function applyHexes(hexes,src){
  const vals=edExpected(),cat=isCategorical(ED.sub);
  if(vals){const h=resample(hexes,vals.length);const prev=new Map(ED.classes.map(o=>[o.v,o]));
    ED.classes=vals.map((v,i)=>({...(prev.get(v)||{v}),v,hex:h[i],src}))}
  else{const h=resample(hexes,ED.classes.length);ED.classes=ED.classes.map((o,i)=>({...o,hex:h[i],src}))}
  if(!cat)ED.classes.forEach(o=>LANGS.forEach(L=>{if(!o[L])delete o[L]}));
  ED.dirty=true;renderEditor();
}
function otherPalettes(){return Object.entries(PAL).filter(([k,d])=>k!==ED.key&&k.endsWith("__"+ED.sub)&&d.classes?.length)}
async function whoName(id){
  if(!id)return t("someone");if(NAMES[id])return NAMES[id];
  try{const ps=await user?.profiles?.([id]);NAMES[id]=ps?.[id]?.name||t("someone")}catch(e){NAMES[id]=t("someone")}
  return NAMES[id];
}

    </div>
    <div class="strip">${ED.classes.map(o=>`<button type="button" style="background:${okHex(o.hex)?o.hex:"#d9d9d9"}" data-copy="${esc(o.hex)}" title="${o.v} · ${esc(o.hex)}" aria-label="${esc(o.hex)}"></button>`).join("")}</div>
    ${ro?"":`<div class="tools">
      <div class="tool"><h4>${t("ed_fromSite")}</h4>

    </div>

      ${k==="lulc"&&!ro?`<button class="btn" id="ed-add" type="button">+ ${t("ed_addRow")}</button>`:""}

async function saveEditor(){
  if(!db||!ED)return;
  const vals=edExpected();
  const classes=ED.classes.filter(o=>okHex(o.hex)).map(o=>{const r={v:+o.v,hex:o.hex.toLowerCase(),src:o.src||"proposta"};if(isCategorical(ED.sub))LANGS.forEach(L=>{if(o[L])r[L]=String(o[L])});return r});
  const body={country:ED.c.country,collection:ED.c.id,subproduct:ED.sub,classes,expected:vals?vals.length:classes.length,
    status:ED.status,notes:ED.notes,updatedBy:myId||null,updatedAt:new Date().toISOString()};
  try{await db.doc("paletas/"+ED.key).set(body);ED.dirty=false;ED.remoteChanged=false;ED.baseUpdatedAt=body.updatedAt;toast(t("ed_saved"));renderEditor()}
  catch(e){toast(e?.code==="invalid_argument"?t("ed_readOnly"):(e?.message||"Erro"));if(e?.code==="invalid_argument"){canWrite=false;renderAll()}}
}

async function saveNewColl(){
  if(!db||!NC)return;
  let country=NC.country,cname="";
  if(country==="__new"){cname=NC.cname.trim();country=cname.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
  const id=NC.id.trim().replace(/[^A-Za-z0-9._-]/g,"");
  if(!country||!id||!(NC.start<=NC.end)||!NC.subs.length){toast("⚠ "+t("nc_id"));return}
  const body={country,countryName:cname||countryName(country),id,start:+NC.start,end:+NC.end,sensor:NC.sensor,subs:NC.subs,notes:"",updatedBy:myId||null,updatedAt:new Date().toISOString()};
  try{await db.doc(`colecoes/${country}__${id}`).set(body);NC=null;toast(t("ed_savedColl"));renderAll()}
  catch(e){toast(e?.message||"Erro")}
}

/* ===================== Ações ===================== */
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("on"),2000)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(e){const r=document.createRange();r.selectNodeContents($("code"));const s=getSelection();s.removeAllRanges();s.addRange(r)}}
const blobDownloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}};
async function save(filename,data){
  if(!downloads){toast(t("noDl"));return}
  try{await downloads.save({filename,data});toast(t("saved"))}catch(e){toast(e&&e.code==="declined"?t("declined"):t("noDl"))}
}
function baseName(){return `mapbiomas_fogo_${S.country}_col${String(collObj().id).replace(".","")}_${S.sub}_${periodLabel().replace("–","_")}`.toLowerCase()}
function renderAll(){renderView();renderConsult();if(S.view==="cadastro"){renderMatrix();renderNewColl();if(ED){const f=findByKey(ED.key);if(f)ED.c=f.c}renderEditor()}}
function setView(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}renderAll()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;store.set("lang",S.lang);renderStatic();renderAll()}
  else if(b.dataset.view){setView(b.dataset.view)}
  else if(b.dataset.coll){pickColl(b.dataset.coll);renderConsult()}
  else if(b.dataset.layout){S.layout=b.dataset.layout;renderConsult()}
  else if(b.dataset.tab){S.tab=b.dataset.tab;renderConsult()}
  else if(b.dataset.cell){if(ED&&ED.dirty&&ED.key!==b.dataset.cell&&PAL[ED.key])toast(t("ed_unsaved"));openEditor(b.dataset.cell)}
  else if(b.dataset.copy){copy(b.dataset.copy)}
  else if(b.dataset.rm){ED.classes.splice(+b.dataset.rm,1);ED.dirty=true;renderEditor()}
  else switch(b.id){
    case"btn-copyhex":copy(items().items.map(o=>o.hex).join("\n"));break;
    case"btn-copy":copy($("code").textContent);break;
    case"btn-dl":{const ext=TABS.find(x=>x[0]===S.tab)[2],suf={gee:"_gee.js",py:"_gee.py",hex:"_hex",hexc:"_hex"}[S.tab]||"";save(`${baseName()}${suf}.${ext}`,(ext==="csv"?"﻿":"")+$("code").textContent);break}
    case"dl-svg":save(baseName()+"_legenda.svg",legendSVG(items().items));break;
    case"dl-png":svgToPng(legendSVG(items().items)).then(bl=>save(baseName()+"_legenda.png",bl)).catch(()=>toast(t("noDl")));break;
    case"nc-cancel":NC=null;renderNewColl();break;
    case"nc-save":saveNewColl();break;
    case"ed-close":ED=null;$("editor").hidden=true;renderMatrix();break;
    case"ed-save":saveEditor();break;
    case"ed-reload":openEditor(ED.key);break;
    case"ed-add":{const used=new Set(ED.classes.map(o=>+o.v));let v=1;while(used.has(v))v++;ED.classes.push({v,hex:"#cccccc",src:"proposta"});ED.dirty=true;renderEditor();break}
    case"ed-del":ED.confirmDel=true;renderEditor();break;
    case"ed-del-no":ED.confirmDel=false;renderEditor();break;
    case"ed-del-yes":db.doc("paletas/"+ED.key).delete().then(()=>{const k=ED.key;ED=null;$("editor").hidden=true;delete PAL[k];renderAll()}).catch(err=>toast(err?.message||"Erro"));break;
    case"tool-site":ED.classes=suggestClasses(ED.c,ED.sub,"site").map(o=>({...o,...Object.fromEntries(LANGS.filter(L=>ED.classes.find(x=>x.v===o.v)?.[L]).map(L=>[L,ED.classes.find(x=>x.v===o.v)[L]]))}));ED.dirty=true;renderEditor();break;
    case"tool-ramp-apply":{let h=RAMPS[ED.tool.ramp].stops.slice();if(ED.tool.rev)h.reverse();applyHexes(h,"proposta");break}
    case"tool-copy-apply":{const k2=$("tool-copy").value,d=PAL[k2];if(!d)break;ED.tool.copyFrom=k2;
      if(isCategorical(ED.sub)&&SUBS[ED.sub].kind!=="scar"){ED.classes=d.classes.map(o=>({...o}));ED.dirty=true;renderEditor()}
      else applyHexes(d.classes.slice().sort((a,b)=>a.v-b.v).map(o=>o.hex),"proposta");break}
    case"tool-paste-apply":{const hs=(ED.tool.paste.match(/#?[0-9a-fA-F]{6}\b/g)||[]).map(h=>(h[0]==="#"?h:"#"+h).toLowerCase());if(hs.length)applyHexes(hs,"proposta");break}
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="sel-country"){S.country=el.value;pickColl(defaultColl(collectionsOf(S.country,S.origin)));renderConsult()}
  else if(el.dataset.of){S.origin[el.dataset.of]=el.checked;renderConsult()}
  else if(el.dataset.mf){S.mOrigin[el.dataset.mf]=el.checked;renderMatrix()}
  else if(el.id==="sel-sub"){S.sub=el.value;renderConsult()}
  else if(el.id==="sel-y"){S.y=+el.value;renderConsult()}
  else if(el.id==="sel-s"){S.s=+el.value;if(S.e<S.s)S.e=S.s;renderConsult()}
  else if(el.id==="sel-e"){S.e=+el.value;renderConsult()}
  // editor
  else if(el.dataset.ec!==undefined){const o=ED.classes[+el.dataset.ec];o.hex=el.value;o.src=o.src==="oficial"?"proposta":o.src;ED.dirty=true;renderEditor()}
  else if(el.dataset.eh!==undefined){const o=ED.classes[+el.dataset.eh],h=el.value.trim();if(/^#?[0-9a-fA-F]{6}$/.test(h)){o.hex=(h[0]==="#"?h:"#"+h).toLowerCase();ED.dirty=true}renderEditor()}
  else if(el.dataset.el){ED.classes[+el.dataset.i][el.dataset.el]=el.value;ED.dirty=true}
  else if(el.dataset.es!==undefined){ED.classes[+el.dataset.es].src=el.value;ED.dirty=true}
  else if(el.dataset.ev!==undefined){ED.classes[+el.dataset.ev].v=+el.value;ED.dirty=true}
  else if(el.id==="ed-status"){ED.status=el.value;ED.dirty=true;renderEditor()}
  else if(el.id==="tool-ramp"){ED.tool.ramp=el.value}
  else if(el.id==="tool-rev"){ED.tool.rev=el.checked}
  else if(el.id==="tool-copy"){ED.tool.copyFrom=el.value}
  else if(el.id==="tool-paste"){ED.tool.paste=el.value}
  // nova coleção
  else if(el.id==="nc-country"){NC.country=el.value;renderNewColl()}
  else if(el.id==="nc-cname"){NC.cname=el.value}
  else if(el.id==="nc-id"){NC.id=el.value}
  else if(el.id==="nc-start"){NC.start=+el.value;renderNewColl()}
  else if(el.id==="nc-end"){NC.end=+el.value;renderNewColl()}
  else if(el.id==="nc-sensor"){NC.sensor=el.value}
  else if(el.dataset.ncs){const s=el.dataset.ncs;NC.subs=el.checked?[...new Set([...NC.subs,s])]:NC.subs.filter(x=>x!==s)}
});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="tool-paste"&&ED)ED.tool.paste=el.value});

/* ===================== Inicialização ===================== */
S.view=(location.hash||"").replace("#","")==="cadastro"?"cadastro":"consultar";
renderStatic();renderAll();
(async()=>{
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  const [dl,dbx,us]=await Promise.all(["downloads","db","user"].map(n=>use?use(n).catch(()=>null):Promise.resolve(null)));
  downloads=dl||blobDownloads;["btn-dl","dl-svg","dl-png"].forEach(id=>$(id).disabled=!downloads);
  user=us;db=dbx;
  if(user){try{myId=await user.id()}catch(e){}try{canWrite=await user.can("data.write")}catch(e){canWrite=null}}
  if(!db){dbState="none";try{const r=await fetch("palettes.json",{cache:"no-cache"});if(r.ok)PAL=await r.json()}catch(e){}renderAll();return}
  dbState="ready";
  // uma assinatura por coleção; o editor só recarrega se não houver edição pendente
  db.collection("paletas").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});PAL=next;
    if(ED){const d=PAL[ED.key];if(d&&d.updatedAt!==ED.baseUpdatedAt){if(ED.dirty)ED.remoteChanged=true;else{openEditor(ED.key,false);return}}}
    renderAll();
  },()=>{dbState="none";renderAll()});
  db.collection("colecoes").onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});DEV=next;renderAll()},()=>{});
  renderAll();
})();
window.addEventListener("hashchange",()=>{const v=(location.hash||"").replace("#","");if(v==="cadastro"||v==="consultar"){S.view=v;renderAll()}});
</script>
